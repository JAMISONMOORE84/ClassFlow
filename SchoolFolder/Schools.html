<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ClassFlow</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #101014;
    color: #eeeeF2;
    font-family: Arial, sans-serif;
}

.container {
    width: 100%;
    max-width: 1050px;
    margin: 0 auto;
    padding: 34px 24px 50px;
}

body {
    background: #101014;
    color: white;
    transition: background 0.2s, color 0.2s;
}

body.light-mode {
    background: #f2f2f5;
    color: #17171a;
}

a {
    text-decoration: none;
}


.card-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 32px;
}

.card {
    height: 300px;
    background: #292a2f;
    border-radius: 21px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    position: relative;
    overflow: hidden;

    cursor: pointer;

    transition: transform 0.2s ease,
                background 0.2s ease;
}

.card:hover {
    transform: translateY(-2px);
    background: #2d2e33;
}

.icon {
    width: 92px;
    height: 92px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-bottom: 20px;
}

.icon svg {
    width: 88px;
    height: 88px;

    fill: none;
    stroke: #dedee4;
    stroke-width: 5;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.icon img {
    width: 140px;
    height: 98px;
    object-fit: contain;
}

.card-title {
    font-size: 31px;
    font-weight: 500;
    letter-spacing: 0.5px;
    text-align: center;
    color: #e8e8ed;
}

.badge {
    position: absolute;

    top: 20px;
    right: 20px;

    min-width: 68px;
    height: 42px;

    padding: 0 14px;

    border-radius: 25px;

    background: #3968ed;

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;
    font-size: 19px;
    font-weight: bold;
}

.back-button {
    position: absolute;
    top: 2px;
    left: 6%;

    background: rgba(40, 41, 47, 0.9);
    color: white;

    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;

    padding: 0.1px 16px;

    font-size: 15px;
    cursor: pointer;

    backdrop-filter: blur(8px);

    transition: 0.2s;
}

.back-button:hover {
    background: rgba(60, 61, 68, 0.95);
}


@media (max-width: 650px) {

    .container {
        padding: 18px 14px 35px;
    }

    .card-grid {
        gap: 18px;
    }

    .card {
        height: 230px;
        border-radius: 18px;
    }

    .icon {
        width: 65px;
        height: 65px;
        margin-bottom: 15px;
    }

    .icon svg {
        width: 64px;
        height: 64px;
    }

    .card-title {
        font-size: 23px;
    }

    .badge {
        top: 12px;
        right: 12px;
        min-width: 52px;
        height: 32px;
        font-size: 15px;
    }
}
</style>
</head>

<body>

    <main id="top">
<section class="hero">
	<div class="hero-content">

    <button class="back-button" onclick="history.back()">
    ← Back
	</div>
</section>

<div class="container">

    <div class="card-grid">

        <a class="card" href="Carmody/carmody.html">
            <div class="icon">
               <img src="Images/CarmodyImage.png">
             </div>

            <div class="card-title">
                Carmody Middle School
            </div>

        </a>


        <a class="card" href="Bear Creek High School/Bearcreek.html">
            <div class="icon">
               <img src="Images/BearCreekHigh.webp">
            </div>

            <div class="card-title">
                Bear Creek High School
            </div>

        </a>


        <a class="card" href="Bear Creek K-8/K-8.html">
            <div class="icon">
               <img src="Images/BearCreekK8.png">
            </div>

            <div class="card-title">
                Bear Creek K-8
            </div>

        </a>


        <a class="card" href="GreenGables/Green.html">
            <div class="icon">
               <img src="Images/GreenGables.png">
            </div>

            <div class="card-title">
                Green Gables
            </div>

        </a>

                    YOUR SVG ICON
                </svg>
            </div>

            <div class="card-title">
                Schedule
            </div>

        </div>

    </div>

</div>
<script>
const savedDarkMode = localStorage.getItem("classflowDarkMode");

if (savedDarkMode === "false") {
    document.body.classList.add("light-mode");
}
</script>
</body>
</html>
