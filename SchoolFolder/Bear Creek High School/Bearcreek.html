<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Coming Soon | ClassFlow</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #101014;
    color: white;
    font-family: Arial, sans-serif;

    display: flex;
    align-items: center;
    justify-content: center;
}

body {
    background: #101014;
    color: white;
    transition: background 0.2s, color 0.2s;
}

body.light-mode {
    background: #f2f2f5;
    color: #17171a;
}

.hero {
	min-height: 50vh;
	display: flex;
	align-items: flex-end;
	padding: 150px 6% 80px;
	position: relative;
	background:
		linear-gradient(90deg, rgba(0,0,0,.88), rgba(0,0,0,.3)),
		url("BearCreekHigh.webp")
		center/cover;
        background-size: 100% 99%;
}

.container {
    text-align: center;
    padding: 30px;
}

.icon {
    width: 90px;
    height: 90px;
    background: #292a2f;
    border-radius: 24px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin: 0 auto 25px;

    font-size: 42px;
}

h1 {
    margin: 0 0 12px;
    font-size: 42px;
}

p {
    margin: 0 auto 25px;
    max-width: 450px;
    color: #a9a9b1;
    font-size: 17px;
    line-height: 1.5;
}

.back-button {
    position: absolute;
    top: 25px;
    left: 6%;

    background: rgba(40, 41, 47, 0.9);
    color: white;

    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;

    padding: 10px 16px;

    font-size: 15px;
    cursor: pointer;

    backdrop-filter: blur(8px);

    transition: 0.2s;
}

.back-button:hover {
    background: rgba(60, 61, 68, 0.95);
}

.badge {
    display: inline-block;
    background: #3968ed;
    color: white;
    padding: 10px 18px;
    border-radius: 25px;
    font-weight: bold;
}

.scroll-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 40px;
    align-items: center;
    justify-content: flex-start;
    width: 100%;
}

.scroll-button {
    background: #3968ed;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 16px;
    cursor: pointer;
    display: inline-block;
    width: auto;
    flex: 0 0 auto;
}

.schedule {
    max-width: 900px;
    margin: 0 auto;
}

#schedule-delay {
    margin-top: 60px;
}

#schedule-delay {
    margin-top: 60px;
}

#schedule-assembly {
    margin-top: 60px;
}

#schedule-tues-thurs {
    margin-top: 60px;
}

#schedule-wed-fri {
    margin-top: 60px;
}

.schedule img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 15px;
}

</style>
</head>

<body>

<main id="top">
<section class="hero">
	<div class="hero-content">
        <h1>Bear Creek High School</h1>
    </div>
    <button class="back-button" onclick="history.back()">
    ← Back
</section>

<div class="top">
    <button class="scroll-button" onclick="scrollToSchedule()">
        View Schedule
    </button>

    <button class="scroll-button" onclick="scrollToScheduleDelay()">
         2-hour delay Schedule
    </button>

    <button class="scroll-button" onclick="scrollToScheduleAssembly()">
         Assembly Schedule
    </button>

    <button class="scroll-button" onclick="scrollToScheduleTuesThurs()">
         Tues-Thurs Schedule
    </button>

    <button class="scroll-button" onclick="scrollToScheduleWedFri()">
         Wed-Fri Schedule
    </button>


</div>

<div class="schedule" id="schedule">

    <img src="Monday(LATESTART).png" alt="School Schedule">

</div>

<div class="schedule" id="schedule-delay">

    <img src="2-Hour Delay.png" alt="School Schedule">

</div>

<div class="schedule" id="schedule-assembly">

    <img src="Assembly Bell.png" alt="School Schedule">

</div>

<div class="schedule" id="schedule-tues-thurs">

    <img src="TUES-THURS.png" alt="School Schedule">

</div>

<div class="schedule" id="schedule-wed-fri">

    <img src="WED-FRI.png" alt="School Schedule">

</div>

<script>
function scrollToSchedule() {
    document.getElementById("schedule").scrollIntoView({
        behavior: "smooth"
    });
}

function scrollToScheduleDelay() {
    document.getElementById("schedule-delay").scrollIntoView({
        behavior: "smooth"
    });
}

function scrollToScheduleAssembly() {
    document.getElementById("schedule-assembly").scrollIntoView({
        behavior: "smooth"
    });
}

function scrollToScheduleTuesThurs() {
    document.getElementById("schedule-tues-thurs").scrollIntoView({
        behavior: "smooth"
    });
}

function scrollToScheduleWedFri() {
    document.getElementById("schedule-wed-fri").scrollIntoView({
        behavior: "smooth"
    });
}

const savedDarkMode = localStorage.getItem("classflowDarkMode");

if (savedDarkMode === "false") {
    document.body.classList.add("light-mode");
}
</script>
</body>
</html>
